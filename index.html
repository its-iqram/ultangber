<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 — Page Not Found</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f6fcf4;
            color: #000;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-page {
            text-align: center;
            padding: 40px 20px;
            max-width: 600px;
        }

        .error-code {
            font-size: clamp(100px, 20vw, 180px);
            font-weight: 800;
            line-height: 1;
            color: #29348e;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(32px, 5vw, 48px);
            margin-bottom: 16px;
        }

        p {
            font-size: 17px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 30px;
        }

        .home-button {
            display: inline-block;
            padding: 14px 24px;

            background: #29348e;
            color: #fff;

            text-decoration: none;
            font-weight: 600;

            border: 2px solid #000;
            border-radius: 12px;

            box-shadow: 4px 4px 0 #000;

            transition: 0.15s ease;
        }

        .home-button:hover {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0 #000;
        }

        .home-button:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }
    </style>
</head>

<body>

    <main class="error-page">

        <div class="error-code">404</div>

        <h1>Page Not Found</h1>

        <p>
            Sorry, the page you're looking for doesn't been used anymore.
        </p>

        <a
            href="https://ultangber.framer.website/"
            class="home-button"
        >
            Go to new Website
        </a>

    </main>

</body>
</html>
